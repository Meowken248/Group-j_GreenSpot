services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ecoreport_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecoreport_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoreport_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ecoreport_db
      # =========================================================================
      # CẤU HÌNH GỬI EMAIL THẬT (GMAIL / OUTLOOK SMTP)
      # =========================================================================
      # Để GreenSpot gửi mã OTP vào đúng hộp thư Email thật của bạn:
      # 1. SMTP_USER: Nhập địa chỉ Gmail của bạn (ví dụ: yourname@gmail.com)
      # 2. SMTP_PASSWORD: Nhập Mật khẩu ứng dụng (Google App Password 16 chữ cái)
      #    * Link tạo: https://myaccount.google.com/apppasswords
      #    * Lưu ý quan trọng: KHÔNG dùng mật khẩu đăng nhập Google thông thường.
      # 3. Sau khi điền, lưu file và chạy lệnh: docker compose up -d backend
      # =========================================================================
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ddatmguyen2023@gmail.com
      SMTP_PASSWORD: deuz znem iyqv nzqo
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoreport_dashboard
    restart: always
    working_dir: /app/air_quality
    command: [ "streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true" ]
    ports:
      - "8501:8501"
    volumes:
      - ./backend:/app
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoreport_frontend
    restart: always
    command: [ "sh", "-c", "pnpm install --prefer-offline --store-dir /root/.local/share/pnpm/store && pnpm dev --host 0.0.0.0" ]
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:

